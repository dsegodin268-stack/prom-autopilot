name: ci
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest
      - name: Компіляція всіх модулів
        run: python -m compileall -q common repricing adding bmparts_mirror competitors tools
      - name: Unit-тести (нормалізація, ціни, brandId, якір)
        run: python -m pytest tests/ -q
