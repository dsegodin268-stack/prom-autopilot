name: add-positions
on:
  workflow_dispatch:
    inputs:
      supplier:
        description: "Постачальник (джерело артикулів)"
        required: true
        default: "BMW"
        type: choice
        options: ["BMW", "PORSCHE"]
      count:
        description: "Скільки позицій додати"
        required: true
        default: "1"
        type: choice
        options: ["1", "10", "50", "100"]
      article:
        description: "Тест на конкретному артикулі (опційно; перекриває count)"
        required: false
        default: ""
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Enrich & stage positions
        env:
          GCP_SA_KEY:    ${{ secrets.GCP_SA_KEY }}
          BMPARTS_TOKEN: ${{ secrets.BMPARTS_TOKEN }}
          SUPPLIER:      ${{ github.event.inputs.supplier }}
          COUNT:         ${{ github.event.inputs.count }}
          ARTICLE:       ${{ github.event.inputs.article }}
        run: python enrich_add.py
