name: bmparts-probe
on:
  workflow_dispatch:
    inputs:
      article:
        description: "Артикул для тесту (код товару BM Parts)"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Diag
        env:
          BMPARTS_TOKEN: ${{ secrets.BMPARTS }}
          ART: ${{ github.event.inputs.article }}
        run: |
          H1="Authorization: $BMPARTS_TOKEN"
          H2="User-Agent: VisimicsBot/1.0"
          echo "== product id_type=code =="
          curl -s -w "\nHTTP %{http_code}\n" -H "$H1" -H "$H2" "https://api.bm.parts/product/$ART?id_type=code&output_field=all" | head -c 900; echo
          echo "== product no id_type =="
          curl -s -w "\nHTTP %{http_code}\n" -H "$H1" -H "$H2" "https://api.bm.parts/product/$ART" | head -c 400; echo
          echo "== search catalog =="
          curl -s -w "\nHTTP %{http_code}\n" -H "$H1" -H "$H2" "https://api.bm.parts/products/search?q=$ART" | head -c 600; echo
