name: bmparts-probe
on:
  workflow_dispatch:
    inputs:
      article:
        description: "Артикул для тесту (або BULK:BMW)"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Probe BM Parts
        env:
          BMPARTS_TOKEN: ${{ secrets.BMPARTS }}
          PROBE_ARTICLE: ${{ github.event.inputs.article }}
        run: python -m tools.bmparts_probe
