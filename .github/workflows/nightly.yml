name: nightly-reprice
on:
  schedule:
    - cron: "23 5 * * *"   # ~08:23 Київ
  workflow_dispatch:
    inputs:
      live:
        description: "1 = писати в таблицю; 0 = DRY-RUN; порожньо = як vars.LIVE"
        required: false
        default: ""
jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Repricer
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AUTONOVA_FOLDER_ID: ${{ secrets.AUTONOVA_FOLDER_ID }}
          AUTONOVA_COOKIE: ${{ secrets.AUTONOVA_COOKIE }}
          AUTONOVA_PROXY: ${{ secrets.AUTONOVA_PROXY }}
          BMPARTS_TOKEN: ${{ secrets.BMPARTS }}
          BMPARTS_BRANDS: ${{ vars.BMPARTS_BRANDS }}
          BM_MIN_INTERVAL: "0.8"
          LIVE: ${{ github.event.inputs.live || vars.LIVE }}
          LIVE_ONLY: ${{ vars.LIVE_ONLY }}
        run: python -m repricing.run
