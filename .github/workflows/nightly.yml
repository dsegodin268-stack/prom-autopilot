name: visimics-autopilot-nightly
on:
  schedule: [{cron: "0 2 * * *"}]
  workflow_dispatch:
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Build feed + dashboard
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          BMPARTS_TOKEN: ${{ secrets.BMPARTS_TOKEN }}
        run: |
          python main.py config.yaml
          python build_dashboard.py
          cp dashboard/index.html feed/dashboard.html
          cp dashboard/dashboard_data.json feed/dashboard_data.json
      - name: Auth to Google Cloud
        if: ${{ vars.GCS_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with: {credentials_json: '${{ secrets.GCP_SA_KEY }}'}
      - name: Publish to GCS
        if: ${{ vars.GCS_BUCKET != '' }}
        run: |
          gcloud storage cp feed/prom.yml gs://${{ vars.GCS_BUCKET }}/prom.yml --cache-control="no-cache"
          gcloud storage cp feed/dashboard.html gs://${{ vars.GCS_BUCKET }}/dashboard.html
          gcloud storage cp feed/dashboard_data.json gs://${{ vars.GCS_BUCKET }}/dashboard_data.json
