name: nightly-reprice
on:
  schedule:
    - cron: "23 5 * * *"     # ~08:23 Київ (8 ранку зі зсувом — GitHub рідше дропає не о рівній годині)
  workflow_dispatch: {}
jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Repricer
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          PROM_API_KEY: ${{ secrets.PROM_API_KEY }}
          AUTONOVA_FOLDER_ID: ${{ secrets.AUTONOVA_FOLDER_ID }}
          AUTONOVA_COOKIE: ${{ secrets.AUTONOVA_COOKIE }}
          BMPARTS_TOKEN: ${{ secrets.BMPARTS }}
          BMPARTS_BRANDS: ${{ vars.BMPARTS_BRANDS }}
          LIVE: ${{ vars.LIVE }}
          LIVE_ONLY: ${{ vars.LIVE_ONLY }}
          LIVE_LIMIT: ${{ vars.LIVE_LIMIT }}
        run: python main.py
