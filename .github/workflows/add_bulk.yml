name: add-bulk
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Бренд (BMW, PORSCHE, VAG...)"
        required: true
        default: "BMW"
      target:
        description: "Куди писати нові позиції"
        required: true
        default: "staging"
        type: choice
        options: ["staging", "export"]
      max:
        description: "Ліміт нових рядків (0 = всі)"
        required: false
        default: "0"
jobs:
  bulk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Bulk add positions (BM Parts prom feed)
        env:
          GCP_SA_KEY:    ${{ secrets.GCP_SA_KEY }}
          BMPARTS_TOKEN: ${{ secrets.BMPARTS }}
          BRAND:         ${{ github.event.inputs.brand }}
          TARGET:        ${{ github.event.inputs.target }}
          MAX:           ${{ github.event.inputs.max }}
        run: python bulk_add.py
